# Local development: a single-node MongoDB replica set (transactions need one) and MinIO in place of R2.
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"]
      interval: 5s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: licitatio
      MINIO_ROOT_PASSWORD: licitatio-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
  minio-setup:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3 && mc alias set local http://minio:9000 licitatio licitatio-dev-secret &&
      mc mb --ignore-existing local/licitatio-files && mc anonymous set none local/licitatio-files"
volumes:
  mongo-data:
  minio-data:
